[project]
name = "api"
version = "0.1.0"
description = "Agentic AI Lab API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.10.1",
    "pydantic-settings>=2.4.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-jobspy>=1.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

